[package]
name = "stm32"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

[dependencies.stm32g4xx-hal]
version = "0.1.0"
git = "https://github.com/stm32-rs/stm32g4xx-hal"
features = ["stm32g474", "rt"]